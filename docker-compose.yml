services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/9nansoft/nan-lrms:latest
    restart: unless-stopped
    # Docker Desktop supplies this hostname automatically, but Linux Docker
    # does not. Map it to the host gateway for an externally hosted Postgres.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3003}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nnlrms}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-db_nnlrms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nn-lrms}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in .env — the public origin this deploy is served from, e.g. https://nn-lrms.example.go.th}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      BMS_VALIDATE_URL: ${BMS_VALIDATE_URL:-https://hosxp.net/phapi/PasteJSON}
      DEV_HOSPITAL_TUNNEL_URL: ${DEV_HOSPITAL_TUNNEL_URL:-}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-false}
      DEV_SIMULATION_ENABLED: ${DEV_SIMULATION_ENABLED:-false}
      MATERNAL_SCREEN_UI_ENABLED: ${MATERNAL_SCREEN_UI_ENABLED:-true}
      MATERNAL_SCREEN_SHADOW_MODE: ${MATERNAL_SCREEN_SHADOW_MODE:-true}
      MATERNAL_SCREEN_INGEST_ENABLED: ${MATERNAL_SCREEN_INGEST_ENABLED:-false}
      MATERNAL_SCREEN_EVENTS_ENABLED: ${MATERNAL_SCREEN_EVENTS_ENABLED:-false}
      ADMIN_ALLOWED_CIDS: ${ADMIN_ALLOWED_CIDS:-}
      READONLY_LOGIN_HCODES: ${READONLY_LOGIN_HCODES:-}
      NEXT_PUBLIC_MOPH_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_MOPH_OAUTH_CLIENT_ID:-}
      MOPH_OAUTH_CLIENT_SECRET: ${MOPH_OAUTH_CLIENT_SECRET:-}
      PROVIDER_API_CLIENT_ID: ${PROVIDER_API_CLIENT_ID:-}
      PROVIDER_API_SECRET_KEY: ${PROVIDER_API_SECRET_KEY:-}
      NEXT_PUBLIC_MOPH_OAUTH_URL: ${NEXT_PUBLIC_MOPH_OAUTH_URL:-https://moph.id.th}
      NEXT_PUBLIC_PROVIDER_API_URL: ${NEXT_PUBLIC_PROVIDER_API_URL:-https://provider.id.th}
      # MOPH Prompt (LINE) alerts. The container only sees what THIS block
      # passes through — without these lines the app runs the pipeline on
      # defaults (transport bms, no keys) no matter what the host
      # .env says, which is why PRD alerts silently never delivered.
      MOPH_ALERTS_ENABLED: ${MOPH_ALERTS_ENABLED:-true}
      MOPH_PROMPT_API_URL: ${MOPH_PROMPT_API_URL:-https://sms.bmscloud.in.th/v1/moph/send-via-bms-session}
      MOPH_TRANSPORT: ${MOPH_TRANSPORT:-bms}
      MOPH_ALERT_API_URL: ${MOPH_ALERT_API_URL:-https://morpromt2c.moph.go.th}
      MOPH_ALERT_CLIENT_KEY: ${MOPH_ALERT_CLIENT_KEY:-}
      MOPH_ALERT_SECRET_KEY: ${MOPH_ALERT_SECRET_KEY:-}
      MOPH_ALERT_MESSAGE_TYPE: ${MOPH_ALERT_MESSAGE_TYPE:-HPT}
      MOPH_MAX_ALERTS_PER_DRAIN: ${MOPH_MAX_ALERTS_PER_DRAIN:-5}
      MOPH_PER_SEND_TIMEOUT_MS: ${MOPH_PER_SEND_TIMEOUT_MS:-3000}
      MOPH_DRAIN_BUDGET_MS: ${MOPH_DRAIN_BUDGET_MS:-10000}
      MOPH_MAX_502_RETRIES: ${MOPH_MAX_502_RETRIES:-4}
      MOPH_RETRY_BACKOFF_MS: ${MOPH_RETRY_BACKOFF_MS:-500}
      MOPH_ALERT_RETENTION_DAYS: ${MOPH_ALERT_RETENTION_DAYS:-90}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"